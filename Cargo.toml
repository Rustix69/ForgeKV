[package]
name = "forgekv"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crc32fast = "1.5.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
# Already in the graph via tempfile; safe `kill(2)` for the server signal test.
rustix = { version = "1.1.5", features = ["process"] }

[features]
# Test-only fault injection (see src/failpoint.rs). Never enable in production.
failpoints = []
