<text x="24.0" y="60.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Writers wait when both memtables are full and the single background worker is still busy.</text>
<text x="24.0" y="79.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Measured with the engine&#x27;s stall counters. In write-heavy runs, nearly every stall began during a compaction.</text>
