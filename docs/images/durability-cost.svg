<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img">
<title>The cost of durability</title>
<desc>Single-thread write throughput: raw fsync, ForgeKV with fsync per write, ForgeKV without fsync.</desc>
<rect width="880" height="352" fill="#fcfcfb"/>
<text x="24.0" y="36.0" font-size="19" fill="#0b0b0b" font-weight="650" text-anchor="start">The cost of durability: one writer, same disk</text>
<text x="24.0" y="60.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Skipping fsync gives about 1,250× the write throughput. With fsync on, ForgeKV runs</text>
<text x="24.0" y="79.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">close to the disk&#x27;s raw sync rate: the fsync, not the engine, sets the limit.</text>
<line x1="300.0" y1="112.0" x2="300.0" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<line x1="407.5" y1="112.0" x2="407.5" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<line x1="515.0" y1="112.0" x2="515.0" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<line x1="622.5" y1="112.0" x2="622.5" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<line x1="730.0" y1="112.0" x2="730.0" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="286.0" y="132.5" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="end">Raw fsync, no database</text>
<text x="286.0" y="147.5" font-size="11.5" fill="#898781" font-weight="400" text-anchor="end">append 100 B + fdatasync</text>
<line x1="349.0" y1="135.0" x2="367.7" y2="135.0" stroke="#86b6ef" stroke-width="2" stroke-linecap="round"/>
<circle cx="356.4" cy="135.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="377.7" y="139.5" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">335/s</text>
<text x="286.0" y="178.5" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="end">ForgeKV, SyncMode::Always</text>
<text x="286.0" y="193.5" font-size="11.5" fill="#898781" font-weight="400" text-anchor="end">WAL fsync before every ack</text>
<line x1="349.2" y1="181.0" x2="393.7" y2="181.0" stroke="#86b6ef" stroke-width="2" stroke-linecap="round"/>
<circle cx="352.2" cy="181.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="403.7" y="185.5" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">306/s</text>
<text x="286.0" y="224.5" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="end">ForgeKV, SyncMode::Never</text>
<text x="286.0" y="239.5" font-size="11.5" fill="#898781" font-weight="400" text-anchor="end">acked once in the OS page cache</text>
<line x1="685.0" y1="227.0" x2="688.1" y2="227.0" stroke="#86b6ef" stroke-width="2" stroke-linecap="round"/>
<circle cx="685.3" cy="227.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="701.3" y="231.5" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">383,643/s</text>
<line x1="300.0" y1="112.0" x2="300.0" y2="250.0" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="268.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">100</text>
<text x="407.5" y="268.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">1K</text>
<text x="515.0" y="268.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">10K</text>
<text x="622.5" y="268.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">100K</text>
<text x="730.0" y="268.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="middle">1M</text>
<text x="515.0" y="288.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">writes per second (log scale)</text>
<text x="24.0" y="312.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Dot = median of 5 runs, line = min–max. Random 16 B keys, 100 B values, 1 thread, 10 s measured.</text>
<text x="24.0" y="328.0" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">One laptop (i5-12500H, ext4 on NVMe). Session 20261026T173115Z, code crc32:bbce3c06.</text>
</svg>
