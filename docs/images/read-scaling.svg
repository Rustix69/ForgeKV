<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img">
<title>Read scaling</title>
<desc>Random-read throughput with 1, 4 and 8 threads.</desc>
<rect width="880" height="352" fill="#fcfcfb"/>
<text x="24.0" y="36.0" font-size="19" fill="#0b0b0b" font-weight="650" text-anchor="start">Reads scale with threads</text>
<text x="24.0" y="60.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Readers take a snapshot and read without holding any engine lock.</text>
<text x="24.0" y="79.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">The dataset fits in RAM, so these reads come from the OS page cache, not the disk.</text>
