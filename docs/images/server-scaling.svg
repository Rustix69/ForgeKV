<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img">
<title>Server throughput</title>
<desc>TCP server throughput with 1, 8 and 32 clients, 50% reads.</desc>
<rect width="880" height="352" fill="#fcfcfb"/>
<text x="24.0" y="36.0" font-size="19" fill="#0b0b0b" font-weight="650" text-anchor="start">Over TCP: throughput by client count</text>
<text x="24.0" y="60.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Each client sends one request at a time over loopback to the Tokio server.</text>
<text x="24.0" y="79.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Throughput peaks at 8 clients; at 32 it falls and median GET latency doubles.</text>
<line x1="300.0" y1="112.0" x2="300.0" y2="250.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
