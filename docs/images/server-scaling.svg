<text x="411.3" y="139.5" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">47,129/s</text>
<text x="286.0" y="178.5" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="end">8 clients</text>
